name: macOS stable signing experiment (ARM64 A-B)

# No workflow_dispatch: a new workflow can run on this branch without landing on main.
on:
  push:
    branches: [test/macos-stable-signing]

permissions:
  contents: read

concurrency:
  group: macos-stable-signing-test
  cancel-in-progress: false

jobs:
  signed-pair:
    # Initial publication is inert: READY is unset, and the commit must explicitly opt in.
    # Only the operator sets READY after secrets and workflow review are complete.
    if: >-
      github.repository == 'D19ital/entropy' &&
      vars.MACOS_TEST_SIGNING_READY == '1' &&
      contains(github.event.head_commit.message, '[macos-signing-test]')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEST_ROOT: ${{ runner.temp }}/entropy-macos-stable-signing-${{ github.run_id }}-${{ github.run_attempt }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate helpers (no key; mocks only)
        run: bash scripts/test_macos_stable_signing.sh
      - name: Build two DIFFERENT native ARM64 executables before key import
        run: bash scripts/build_macos_test_pair.sh
      - name: Import existing test certificate, sign, verify and package A-B
        env:
          MACOS_TEST_SIGNING_READY: ${{ vars.MACOS_TEST_SIGNING_READY }}
          MACOS_TEST_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_TEST_CERTIFICATE_P12_BASE64 }}
          MACOS_TEST_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_TEST_CERTIFICATE_PASSWORD }}
        run: bash scripts/sign_macos_test_pair.sh
      - name: Always restore keychain list and remove private material
        if: always()
        run: bash scripts/sign_macos_test_pair.sh cleanup
      - name: Upload test DMGs and operator instructions (never release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: entropy-macos-stable-signing-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_ROOT }}/artifacts/entropy-signing-test-A-arm64.dmg
            ${{ env.TEST_ROOT }}/artifacts/entropy-signing-test-B-arm64.dmg
            ${{ env.TEST_ROOT }}/artifacts/SHA256SUMS
            ${{ env.TEST_ROOT }}/artifacts/README.ru.md
            ${{ env.TEST_ROOT }}/artifacts/signature-check.txt
          if-no-files-found: error
          retention-days: 7
